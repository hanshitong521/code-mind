# skill.yaml — ai-design（DiagramMind v6.6）
# 契约：skills/ai-skill-mcp-Y/schemas/skill-manifest.schema.json（spec-v2 §8 / §17）
# 校验：python3 skills/ai-skill-mcp-Y/scripts/manifest_validate.py --path skills/ai-design/skill.yaml
# 禁: 写入密钥/生产连接串/整段日志；禁: 用本文件取代 SKILL.md 根文档。
#
# 变更记录（references/skill-change-gate.md 六步门）：
#   1 原因   — 本 skill 此前无 skill.yaml：加载模式、成本、触发排除面全未声明（审计报
#              「triggers.exclude 为空：Precision 风险」+「未声明 loading.mode」）
#   2 证据   — 根文档改前 131 行 / 710 words / est_tokens=2016，超 120 行硬顶与 500 words 线；
#              瘦身后实测 59 行 / 445 words / est_tokens=1399（_common.est_tokens 口径）
#   3 影响面 — 仅新增本声明 + 根文档瘦身；description 逐字未改（Recall/路由依赖它），
#              references/ 指针与 STOP 禁项全量存活（已逐项断言）
#   4 批准   — 用户显式「深度整改」
#   5 版本   — 6.6.0（对齐 SKILL.md frontmatter 既有版本，未跳版）
#   6 回滚   — git revert；或删除本文件即回到「无声明」旧行为（根文档瘦身需另行 revert）

id: ai-design
name: DiagramMind
version: 6.6.0
kind: skill
owner: ai-programming-docs
description: >-
  DiagramMind — 把需求/源码/文档变成一张看得懂的系统图。分析模块·数据流·角色 → 选图型 → 写 Mermaid → 预检 →
  渲染 + 构图审计 + drift。Triggers: /ai-design, /diagram, DiagramMind, 画图, 架构图, 流程图, 时序图.

category: docs
tags:
  - diagram
  - mermaid
  - architecture-diagram
  - design-doc
  - visualization
  - flowchart
  - drift
  - handoff
  # 中文检索标签（二字滑窗；只加「期望 ai-design」且不误伤金标的词）
  - 表单
  - 字段
  - 重命
  - 映射
  - 同步
  - 链路
  - 模块
  - 消费

triggers:
  include:
    - /ai-design
    - /diagram
    - DiagramMind
    - 画图
    - 架构图
    - 流程图
    - 时序图
  # 负向面只放**本 skill 自己的易混邻域**：本 skill 只做 HOW（设计图 + 设计交付），
  # 不做 WHAT 澄清、不写业务码。
  # 禁抄别家领域词（如 `查日志`/`对账` 属 ai-skill-mcp-Y 的排除面）——
  # 抄进来会让任何提到这些词的任务把**所有** skill 全排除掉，`recommended` 变空
  # （命中 ACCEPTANCE §5 Hard Gate「该用找不到」）。BM-06 即因此从 ai-design 掉到空。
  exclude:
    - /ai-code
    - 写业务码
    - 代码实现
    - 改生产配置
    - /ai-requirement
    - 澄清需求
    - Requirement Gate

cost:
  # 实测（_common.est_tokens 口径，根文档瘦身后）：131 行/710 words/2016 tok → 59 行/445 words/1399 tok
  context_tokens_estimate: 1399
  # standard：命中后要扫项目取证 + 起 Chrome 渲染，但渲染走增量缓存（未变 ≈0.19s），
  # 重活委托给 scripts/，不属 expensive 档。
  runtime_class: standard

risk:
  level: low
  destructive: false

loading:
  # 根 SKILL.md frontmatter 已有 disable-model-invocation: true → 本就是 on-demand；
  # 此处显式声明，保持「声明来源」与「实际行为」一致（不改成 always）。
  mode: on-demand

verification:
  required: true

# read=扫目标项目取证（分析/漂移检测）；write 仅限生成物目录 docs/diagram/
# （design.md · design.viewer.html · assets/**），不触业务代码、不写生产配置。
security_permissions:
  - read
  - write
