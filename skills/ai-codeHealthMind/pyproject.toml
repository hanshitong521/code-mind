[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehealthmind"
version = "1.0.0"
description = "CodeHealthMind -- a code-health audit and merge gate for AI-written code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeHealthMind contributors" }]
keywords = ["code-review", "static-analysis", "ai-coding", "merge-gate", "tech-debt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# Intentionally empty: the engine is stdlib-only.  See docs/adr/ADR-001-language-and-dependencies.md
dependencies = []

[project.optional-dependencies]
# Only used by the *optional* semantic reviewer backend.  The gate itself
# never needs these.
yaml = ["PyYAML>=6.0"]

[project.scripts]
codehealth = "chm.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["chm"]
omit = ["*/test/*"]
