# mcp-registry.example.yaml — MCP 清单模板
# 复制到下列任一落点（按序探测，命中即用）：
#   shared/mcp-registry.yaml | shared/mcp-manifest.yaml
#   .skillmind/mcps.yaml     | .skillmind/mcps.json
# 格式与成本口径详见：references/mcp-registry.md
# 校验：python3 scripts/skillmind.py registry build && python3 scripts/skillmind.py audit --scope mcp
#
# 核心观念：**工具定义是每轮都进上下文的常驻成本**（等价于 always skill 的 root_words）。
# 只数工具个数 = 把成本藏起来。故每个工具都要能被估算 schema token。

schema_name: skillmind-mcp-registry
schema_version: 1

servers:
  - name: filesystem
    transport: stdio            # stdio | sse | http
    owner: ai-programming-docs  # 对齐 shared/capability-registry.yaml
    # standing: true = 每轮都暴露给模型。默认 false。
    # 审计对 standing 且 tool_tokens>0 报 LAZY-LOAD（每轮都付）。
    standing: false
    tools:
      - name: read_file
        # description 只答「何时用」。禁写工作流、禁放示例、禁复述参数含义。
        description: Read a file from disk. Use when you need its contents.
        params:
          path: string
        destructive: false
      - name: write_file
        description: Write content to a file. Use when the user asks to save output.
        params:
          path: string
          content: string
        # destructive: true → 需二次权限检查，且默认隐藏。
        destructive: true
        # schema_tokens 可选：有实测值时直接给，跳过 est_tokens 估算。
        # schema_tokens: 180

  - name: db-readonly
    transport: stdio
    owner: ai-programming-docs
    standing: false
    tools:
      - name: query
        description: Run a read-only SQL query. Use when you need to inspect data.
        params:
          sql: string
        destructive: false
