# schema-versions.yaml — 跨仓契约版本注册表（Peak v3 §30 / §29 DOC3-09）
#
# 规则（§30）：
#   - minor 向后兼容
#   - breaking change 升 major
#   - Consumer 必须明确支持版本
#   - 不认识的 major → BLOCKED，不猜
#   - 禁止多个仓复制 schema 后各改一版
#
# canonical 位置：ai-programming-docs/shared/
# 各仓测试时拉 release copy 或安装 bundle。

schema_name: schema-versions
schema_version: 1

# ── 契约注册表 ──────────────────────────────────────────────────────
contracts:

  handoff:
    file: shared/handoff-schema.yaml
    schema_version: 1
    major: 1
    minor: 1
    status: ACTIVE
    compatible_consumers:
      - ai-design
      - ai-code
    breaking_history: []

  release-manifest:
    file: shared/release-manifest.yaml
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - build_release.py
      - verify_skill_drift.py
      - validate_bundle.py
      - install.ps1
    breaking_history: []

  capability-registry:
    file: shared/capability-registry.yaml
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - validate_bundle.py
      - install.ps1
    breaking_history: []

  verification-policy:
    file: shared/verification-policy.yaml
    schema_version: 1
    major: 1
    minor: 1
    status: ACTIVE
    compatible_consumers:
      - ai-code
      - ai-design
    breaking_history: []

  deploy-bundle:
    file: deploy.bundle.yaml
    schema_version: 2
    major: 2
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - install.ps1
      - validate_bundle.py
    breaking_history:
      - version: 1
        version_2_breaks: "新增 release 段（manifest/capability_registry/schema_versions 指针）"
        note: "v1 仍可被 install.ps1 读取（release 段可选）"

  requirementmind-state:
    file: skills/ai-requirement/schemas/state.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - requirement-mind
      - ai-requirement
    breaking_history: []

  # ── SkillMind Ultimate V2.0（skill_id: ai-skill-mcp-Y）────────────────
  # 契约 key 必须等于文件内 schema_name（validate_bundle.py §5 强校验）。
  skillmind-skill-manifest:
    file: skills/ai-skill-mcp-Y/schemas/skill-manifest.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - ai-skill-mcp-Y
      - manifest_validate.py
    breaking_history: []

  skillmind-registry:
    file: skills/ai-skill-mcp-Y/schemas/registry.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - ai-skill-mcp-Y
      - registry_build.py
    breaking_history: []

  skillmind-route-request:
    file: skills/ai-skill-mcp-Y/schemas/route-request.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - ai-skill-mcp-Y
      - router.py
    breaking_history: []

  skillmind-route-result:
    file: skills/ai-skill-mcp-Y/schemas/route-result.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - ai-skill-mcp-Y
      - router.py
      - token-mind
    breaking_history: []

  skillmind-score-record:
    file: skills/ai-skill-mcp-Y/schemas/score-record.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - ai-skill-mcp-Y
      - score.py
      - test-mind
    breaking_history: []

  skillmind-telemetry-event:
    file: skills/ai-skill-mcp-Y/schemas/telemetry-event.schema.json
    schema_version: 1
    major: 1
    minor: 0
    status: ACTIVE
    compatible_consumers:
      - ai-skill-mcp-Y
      - telemetry.py
      - token-mind
    breaking_history: []

# ── Consumer 最低支持版本（不满足则 BLOCKED）────────────────────────
consumer_requirements:
  install.ps1:
    handoff: ">=1.0 <2.0"
    release-manifest: ">=1.0 <2.0"
    deploy-bundle: ">=1.0 <3.0"
  validate_bundle.py:
    deploy-bundle: ">=1.0 <3.0"
    release-manifest: ">=1.0 <2.0"
    capability-registry: ">=1.0 <2.0"

# 版本号语法约定
versioning:
  format: "major.minor"
  unknown_major_policy: BLOCKED
  note: "不认识的 major 一律 BLOCKED，禁止猜测兼容"
